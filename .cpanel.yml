---
# Site Document Root should be $DEPLOYPATH/public .
# Typical: subdomain folder .../ims.higagroup.rw/higa/public .
#
# REPOPATH = cPanel Git "Repository Path" (where pull updates live).
# DEPLOYPATH = Laravel root containing public/ actually used by ims.higagroup.rw .
# Adjust both if your usernames/paths differ.
deployment:
  tasks:
    - export REPOPATH=/home/higanvac/ims
    - export DEPLOYPATH=/home/higanvac/ims.higagroup.rw/higa
    - cd "$REPOPATH" && /bin/echo "DEPLOY_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) REPO_HEAD=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
    - cd "$REPOPATH" && /usr/bin/rsync -a --exclude='.git/' --exclude='node_modules/' --exclude='vendor/' --exclude='.env' --exclude='storage/' ./ "$DEPLOYPATH/"
    # Wipe Laravel bootstrap manifest cache BEFORE composer runs artisan discover (prevents booting stale dev providers).
    - find "$DEPLOYPATH/bootstrap/cache" -maxdepth 1 -type f '(' -name '*.php' -o -name '*.tmp' ')' -delete || true
    - cd "$REPOPATH" && /bin/cp public/index.php "$DEPLOYPATH/public/index.php"
    - cd "$REPOPATH" && /bin/cp public/.htaccess "$DEPLOYPATH/public/.htaccess"
    - cd "$DEPLOYPATH" && composer install --no-dev --optimize-autoloader --no-interaction
    - cd "$DEPLOYPATH" && php artisan optimize:clear --no-ansi
